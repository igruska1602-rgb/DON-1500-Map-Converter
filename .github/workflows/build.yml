
name: DON-1500 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DON-1500_Map_Converter_Prototype.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP archive
        run: |
          set -eu
          echo "Checking project archive..."
          find . -maxdepth 2 -type f -name '*.zip' -print
          ZIP_FILE="DON-1500_Map_Converter_Prototype.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP not found: $ZIP_FILE"
            echo "Upload the ZIP to the repository root with this exact name."
            exit 1
          fi
          unzip -t "$ZIP_FILE"

      - name: Extract Android project
        run: |
          set -eu
          mkdir -p source
          unzip -q DON-1500_Map_Converter_Prototype.zip -d source
          SETTINGS="$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle was not found in the ZIP"
            find source -maxdepth 4 -type f | head -n 100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle" -o -f "$PROJECT_DIR/app/build.gradle.kts"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew --no-daemon assembleDebug
          else
            echo "::error::Gradle wrapper gradlew is missing from the project ZIP"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DON-1500-Map-Converter-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
