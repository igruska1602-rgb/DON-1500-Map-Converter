name: DON-1500 Converter APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DON1500_Converter_V3.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify and extract source project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          test -f DON1500_Converter_V3.zip
          unzip -t DON1500_Converter_V3.zip
          mkdir -p "$RUNNER_TEMP/don1500-source"
          unzip -q DON1500_Converter_V3.zip -d "$RUNNER_TEMP/don1500-source"
          PROJECT_DIR="$(find "$RUNNER_TEMP/don1500-source" -type f -name settings.gradle -printf '%h\n' -quit)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DON-1500-Converter-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
