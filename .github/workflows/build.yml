
name: DON-1500 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -iname 'DON-1500_Map_Converter_Prototype.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -type f -iname '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP archive found in repository."
            exit 1
          fi

          echo "Using archive: $ZIP_FILE"
          unzip -t "$ZIP_FILE"
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          SETTINGS="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android project not found inside ZIP."
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::gradlew is missing from the Android project."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: ${{ github.workspace }}/${{ steps.extract.outputs.project_dir }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DON-1500-Map-Converter-APK
          path: ${{ github.workspace }}/${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
