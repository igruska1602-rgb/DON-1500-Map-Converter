name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if it was uploaded as a ZIP
        run: |
          if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*')" ]; then
            z=$(find . -name '*.zip' -not -path './.git/*' | head -1)
            if [ -n "$z" ]; then echo "Unzipping $z"; mkdir -p _src && unzip -q -o "$z" -d _src; fi
          fi

      - name: Find project folder
        id: p
        run: |
          f=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts NOT FOUND. Files in repo:"; find . -not -path "./.git/*" | head -50; exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Project folder: $(dirname "$f")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DON1500-Converter-debug-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk

      - name: Publish APK to Releases (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DON-1500 Converter build ${{ github.run_number }}
          files: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
