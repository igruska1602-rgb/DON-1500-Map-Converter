
name: DON-1500 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "DON-1500_Map_Converter_Prototype.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check and extract project
        shell: bash
        run: |
          set -euo pipefail
          test -f DON-1500_Map_Converter_Prototype.zip
          mkdir -p source
          unzip -q DON-1500_Map_Converter_Prototype.zip -d source
          test -f source/FS25_FS26_Converter/settings.gradle
          test -f source/FS25_FS26_Converter/app/build.gradle
          echo "Project files found."

      - name: Build debug APK
        working-directory: source/FS25_FS26_Converter
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DON-1500-Map-Converter-debug
          path: source/FS25_FS26_Converter/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
