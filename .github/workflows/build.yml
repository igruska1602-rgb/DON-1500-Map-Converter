
name: DON-1500 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "DON-1500_Map_Converter_Prototype.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -q DON-1500_Map_Converter_Prototype.zip -d source
          test -f source/FS25_FS26_Converter/app/build.gradle

      - name: Build debug APK
        working-directory: source/FS25_FS26_Converter
        run: gradle assembleDebug --no-daemon

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DON-1500-Map-Converter-debug
          path: source/FS25_FS26_Converter/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
