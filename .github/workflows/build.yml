
name: DON-1500 Converter APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -iname 'DON1500_Converter_DOWNLOAD.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Converter ZIP not found. Upload the ZIP to the repository."
            exit 1
          fi

          echo "Archive: $ZIP_FILE"
          unzip -t "$ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/don1500-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/don1500-project"

          SETTINGS="$(find "$RUNNER_TEMP/don1500-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle not found"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DON-1500-Converter-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
