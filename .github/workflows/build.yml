name: DON-1500 Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Gradle project
        id: find
        run: |
          S=$(find . -name settings.gradle -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$S" ]; then
            echo "settings.gradle не найден. Структура репозитория:"
            find . -maxdepth 3 -not -path "./.git/*"
            exit 1
          fi
          DIR=$(dirname "$S")
          echo "Проект найден в: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DON-1500-Map-Converter-debug
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
