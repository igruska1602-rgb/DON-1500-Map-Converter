name: DON-1500 Converter APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DON1500_Converter_V4.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          unzip -t DON1500_Converter_V4.zip
          mkdir -p "$RUNNER_TEMP/don1500-v4"
          unzip -q DON1500_Converter_V4.zip -d "$RUNNER_TEMP/don1500-v4"
          PROJECT_DIR="$(find "$RUNNER_TEMP/don1500-v4" -type f -name settings.gradle -printf '%h\n' -quit)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DON-1500-Converter-V4-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
