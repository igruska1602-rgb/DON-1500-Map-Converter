name: DON-1500 Converter APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DON1500_Converter_V2.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo '::error::Android sdkmanager was not found on the GitHub runner.'
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check and extract project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="DON1500_Converter_V2.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Upload $ZIP_FILE to the repository root first."
            exit 1
          fi
          unzip -t "$ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/don1500-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/don1500-project"
          PROJECT_DIR="$(find "$RUNNER_TEMP/don1500-project" -type f -name settings.gradle -printf '%h\n' -quit)"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo '::error::The ZIP does not contain a valid Android project.'
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DON-1500-Converter-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
